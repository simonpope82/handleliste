<!doctype html><html lang="nb"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handleliste</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e9e4a"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;font:600 20px/1.3 system-ui,Verdana,sans-serif;background:#f4f6f4;color:#1b1b1b}
header{position:sticky;top:0;background:#fff;padding:10px 12px;box-shadow:0 2px 6px #0002;z-index:5}
.bar{height:34px;border-radius:17px;background:#e3e3e3;overflow:hidden;position:relative}
.fill{height:100%;background:#1e9e4a;transition:width .3s}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:3px solid #ccc;background:#fff;border-radius:14px;padding:4px 10px;height:56px;display:flex;align-items:center;gap:6px;font-size:18px}
.chip.on{border-color:#1e9e4a;background:#e7f6ec}.chip img{height:40px;width:40px;object-fit:contain}
main{padding:10px 12px 140px}
.cat{margin:16px 0 6px;font-size:22px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:8px 0;min-height:68px;box-shadow:0 1px 3px #0002}
.tick{width:46px;height:46px;border-radius:50%;border:4px solid #1e9e4a;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.done .tick{background:#1e9e4a}.done .name{text-decoration:line-through;opacity:.45}
.name{flex:1;font-size:24px}.item img{height:40px;width:40px;object-fit:contain}
.del{border:0;background:none;font-size:28px;padding:6px}
.fab{position:fixed;bottom:18px;width:84px;height:84px;border-radius:50%;border:0;font-size:46px;color:#fff;box-shadow:0 4px 10px #0004}
#plus{right:18px;background:#1e9e4a}#mic{left:18px;background:#1565c0}#mic.live{background:#d32f2f;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.1)}}
dialog{border:0;border-radius:20px;width:94vw;max-width:520px;padding:16px}
dialog input{width:100%;font-size:28px;padding:14px;border:3px solid #1e9e4a;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{border:3px solid #ddd;border-radius:16px;background:#fff;padding:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tile.on{border-color:#1e9e4a;background:#e7f6ec}.tile img{max-width:100%;max-height:100%}
.shops button{display:flex;width:100%;justify-content:space-between;font-size:20px;padding:12px;margin:5px 0;border:2px solid #ddd;border-radius:12px;background:#fff}
.shops button.on{border-color:#1e9e4a;background:#e7f6ec}
.big{width:100%;font-size:26px;padding:16px;border:0;border-radius:16px;background:#1e9e4a;color:#fff;margin-top:8px}
.ghost{background:#eee;color:#222}.empty{text-align:center;font-size:70px;margin-top:40px;opacity:.5}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;display:none;max-width:90vw;text-align:center}
</style></head><body>
<header><div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct"></div></div><div class="chips" id="chips"></div></header>
<main id="list"></main>
<button class="fab" id="mic" aria-label="Snakk">🎤</button><button class="fab" id="plus" aria-label="Legg til">＋</button>
<div id="toast"></div>
<dialog id="add"><form method="dialog" id="addf"><input id="txt" placeholder="🥛 ..." autocomplete="off">
<div class="tiles" id="tiles"></div><div class="shops" id="shops"></div>
<button class="big" value="ok">✔</button><button class="big ghost" value="no" formnovalidate>✖</button></form></dialog>
<script src="app.js"></script></body></html>
