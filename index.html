<!doctype html><html lang="nb"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handleliste</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e9e4a"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font:600 20px/1.3 system-ui,Verdana,sans-serif;background:#f4f6f4;color:#1b1b1b}
header{position:sticky;top:0;background:#fff;padding:10px 12px;box-shadow:0 2px 6px #0002;z-index:5}
.bar{height:34px;border-radius:17px;background:#e3e3e3;overflow:hidden;position:relative}
.fill{height:100%;background:#1e9e4a;transition:width .3s}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.logos{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:10px 0 4px}.logos button{border:3px solid #ddd;border-radius:12px;background:#fff;padding:3px;height:54px;display:flex;align-items:center;justify-content:center;font-size:26px}.logos button img{max-width:100%;max-height:44px;object-fit:contain}.logos button.on{border-color:#1e9e4a;background:#e7f6ec;box-shadow:0 0 0 3px #1e9e4a55}
#branch{width:100%;font-size:20px;padding:10px;border:3px solid #1e9e4a;border-radius:12px;background:#fff;margin-top:4px}
.addto{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0;font-size:22px}.addto img{height:44px}
.big.blue{background:#1565c0}.big.blue.live{background:#d32f2f}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:3px solid #ccc;background:#fff;border-radius:14px;padding:4px 10px;height:56px;display:flex;align-items:center;gap:6px;font-size:18px}
.chip.on{border-color:#1e9e4a;background:#e7f6ec}.chip img{height:40px;width:40px;object-fit:contain}
main{padding:10px 12px 140px}
.cat{margin:16px 0 6px;font-size:22px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:8px 0;min-height:68px;box-shadow:0 1px 3px #0002}
.tick{width:46px;height:46px;border-radius:10px;border:4px solid #1e9e4a;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.done .tick{background:#1e9e4a}.done .name{text-decoration:line-through;opacity:.45}
.name{flex:1;font-size:24px}.name small{font-size:16px;color:#666;font-weight:500}.item img{height:40px;width:40px;object-fit:contain}
.del{border:0;background:none;font-size:28px;padding:6px}
.fab{position:fixed;bottom:18px;width:84px;height:84px;border-radius:50%;border:0;font-size:46px;color:#fff;box-shadow:0 4px 10px #0004}
#plus{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);border:0;border-radius:40px;background:#1e9e4a;color:#fff;font:700 20px system-ui;padding:12px 26px 12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px #0005;white-space:nowrap;z-index:6}#plus span{font-size:44px;line-height:1;background:#fff3;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}.empty~#plus{}
@keyframes p{50%{transform:scale(1.1)}}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;overflow-y:auto;padding:12px}.sheet[hidden]{display:none}.sheet form{background:#fff;border-radius:20px;max-width:520px;margin:0 auto;padding:16px}
.sheet textarea{width:100%;font-size:28px;padding:14px;border:3px solid #1e9e4a;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{border:3px solid #ddd;border-radius:16px;background:#fff;padding:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tile.on{border-color:#1e9e4a;background:#e7f6ec}.tile img{max-width:100%;max-height:100%}
.shops button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:#1b1b1b;min-height:56px;font-size:20px;padding:12px;margin:5px 0;border:2px solid #ddd;border-radius:12px;background:#fff}
.shops button span:first-child{flex:1;min-width:0}.shops button span+span{flex:none;color:#555}
.shops button.on{border-color:#1e9e4a;background:#e7f6ec}
.big{width:100%;font-size:26px;padding:16px;border:0;border-radius:16px;background:#1e9e4a;color:#fff;margin-top:8px}
.ghost{background:#eee;color:#222}.empty{text-align:center;font-size:70px;margin-top:40px;opacity:.5}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;display:none;max-width:90vw;text-align:center}
</style></head><body>
<header><div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct"></div></div><div class="logos" id="chips"></div><select id="branch" hidden aria-label="Butikk"></select></header>
<main id="list"></main>
<button id="plus"><span>＋</span>Lim inn / legg til handleliste</button>
<div id="toast"></div>
<div id="add" class="sheet" hidden><form id="addf" action="#"><textarea id="txt" rows="4" placeholder="melk, egg, brød …"></textarea>
<div class="addto" id="addto"></div><button type="button" class="big blue" id="smic">🎤</button>
<button class="big" type="submit" id="ok">✔</button><button class="big ghost" type="button" id="cancel">✖</button></form></div>
<script src="app.js?v=4"></script></body></html>
